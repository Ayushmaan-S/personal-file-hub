<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Personal File Hub - Login</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #0f1115;

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        .login-box {

            width: 380px;

            padding: 35px;

            background: #181b21;

            border:
                1px solid #2b303a;

            border-radius: 14px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.4);
        }


        h1 {

            text-align: center;

            margin:
                0 0 8px 0;

            font-size: 28px;
        }


        .subtitle {

            text-align: center;

            color: #8f96a3;

            margin-bottom: 30px;
        }


        label {

            display: block;

            margin-top: 18px;

            margin-bottom: 7px;

            font-size: 14px;

            color: #c5cad3;
        }


        input {

            width: 100%;

            padding:
                12px 14px;

            background: #101217;

            border:
                1px solid #343944;

            border-radius: 8px;

            color: white;

            font-size: 15px;

            outline: none;
        }


        input:focus {

            border-color: #6d7cff;
        }


        button {

            width: 100%;

            margin-top: 25px;

            padding: 12px;

            border: none;

            border-radius: 8px;

            background: white;

            color: #111318;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }


        button:hover {

            background: #dddddd;
        }


        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;
        }


        #message {

            margin-top: 18px;

            text-align: center;

            min-height: 20px;

            font-size: 14px;
        }

    </style>

</head>


<body>


<div class="login-box">


    <h1>
        Personal File Hub
    </h1>


    <div class="subtitle">
        Your private cloud
    </div>


    <form id="loginForm">


        <label for="username">
            Username
        </label>


        <input
            id="username"
            type="text"
            placeholder="Enter username"
            autocomplete="username"
            required
        >


        <label for="password">
            Password
        </label>


        <input
            id="password"
            type="password"
            placeholder="Enter password"
            autocomplete="current-password"
            required
        >


        <button
            id="loginButton"
            type="submit"
        >
            Login
        </button>


    </form>


    <div id="message"></div>


</div>


<script>


/*
    IMPORTANT:
    Replace this with your actual
    FastAPI port 8000 URL.
*/

const API_URL =
    "https://personal-file-hub.onrender.com";


const form =
    document.getElementById(
        "loginForm"
    );


const usernameInput =
    document.getElementById(
        "username"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );


const message =
    document.getElementById(
        "message"
    );


function showMessage(
    text,
    success = false
) {

    message.textContent = text;

    if (success) {

        message.style.color =
            "#5ee39b";

    } else {

        message.style.color =
            "#ff6b6b";

    }

}


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const username =
            usernameInput.value.trim();


        const password =
            passwordInput.value;


        if (!username || !password) {

            showMessage(
                "Enter username and password."
            );

            return;

        }


        loginButton.disabled = true;

        loginButton.textContent =
            "Logging in...";


        showMessage(
            "Connecting..."
        );


        try {


            const response =
                await fetch(
                    API_URL + "/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                username:
                                    username,

                                password:
                                    password
                            })
                    }
                );


            const data =
                await response.json();


            console.log(
                "Login response:",
                data
            );


            if (
                response.ok &&
                data.success &&
                data.token
            ) {


                /*
                    Save JWT
                */

                localStorage.setItem(
                    "token",
                    data.token
                );


                /*
                    Verify that it was
                    actually saved.
                */

                const savedToken =
                    localStorage.getItem(
                        "token"
                    );


                if (!savedToken) {

                    showMessage(
                        "Could not save login session."
                    );

                    return;

                }


                showMessage(
                    "Login successful!",
                    true
                );


                /*
                    Redirect ONLY here,
                    after successful login.
                */

                setTimeout(
                    function() {

                        window.location.href =
                            "dashboard.html";

                    },
                    300
                );


            } else {


                showMessage(
                    data.message ||
                    "Invalid username or password."
                );

            }


        } catch (error) {


            console.error(
                "Login error:",
                error
            );


            showMessage(
                "Could not connect to the server."
            );


        } finally {


            loginButton.disabled = false;

            loginButton.textContent =
                "Login";

        }

    }
);


</script>


</body>

</html>
