<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Personal File Hub - Login</title>

    <link rel="icon" type="image/png" href="assets/miku-logo.png">


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #0f1115;

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


.site-logo {
            display: flex;
            justify-content: center;
            margin-bottom: 14px;
        }

        .site-logo img {
            width: min(250px, 100%);
            height: auto;
            display: block;
            object-fit: contain;
        }


        .login-box {

            width: 380px;

            padding: 35px;

            background: #181b21;

            border:
                1px solid #2b303a;

            border-radius: 14px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.4);
        }


        h1 {

            text-align: center;

            margin:
                0 0 8px 0;

            font-size: 28px;
        }


        .subtitle {

            text-align: center;

            color: #8f96a3;

            margin-bottom: 30px;
        }


        label {

            display: block;

            margin-top: 18px;

            margin-bottom: 7px;

            font-size: 14px;

            color: #c5cad3;
        }


        input {

            width: 100%;

            padding:
                12px 14px;

            background: #101217;

            border:
                1px solid #343944;

            border-radius: 8px;

            color: white;

            font-size: 15px;

            outline: none;
        }


        input:focus {

            border-color: #6d7cff;
        }


        button {

            width: 100%;

            margin-top: 25px;

            padding: 12px;

            border: none;

            border-radius: 8px;

            background: white;

            color: #111318;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }


        button:hover {

            background: #dddddd;
        }


        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;
        }


        #message {

            margin-top: 18px;

            text-align: center;

            min-height: 20px;

            font-size: 14px;
        }

    
/* MIKU THEME */
:root {
  --miku: #39d8e8;
  --miku-bright: #62e9f5;
  --miku-soft: #9af3f7;
  --purple: #a879ff;
  --purple-bright: #c49cff;
  --bg: #080b12;
  --panel: #101522;
  --panel-2: #151b2a;
  --border: #253149;
  --text: #eefcff;
  --muted: #91a0b8;
}
body { background: radial-gradient(circle at 50% 15%, rgba(57,216,232,.10), transparent 32%), radial-gradient(circle at 85% 85%, rgba(168,121,255,.10), transparent 30%), var(--bg); color: var(--text); }
.login-box { background: rgba(16,21,34,.94); border-color: rgba(57,216,232,.25); box-shadow: 0 24px 70px rgba(0,0,0,.55), 0 0 40px rgba(57,216,232,.08); }
.site-logo img { filter: drop-shadow(0 12px 28px rgba(57,216,232,.12)); }
h1 { color: var(--text); }
.subtitle { color: var(--muted); }
label { color: #c7d5e8; }
input { background: #0a0f1a; border-color: #293752; color: var(--text); }
input:focus { border-color: var(--miku); box-shadow: 0 0 0 3px rgba(57,216,232,.12); }
button { background: linear-gradient(135deg, var(--miku), #69cfff); color: #061017; box-shadow: 0 8px 24px rgba(57,216,232,.16); }
button:hover { background: linear-gradient(135deg, var(--miku-bright), #88d9ff); }
#message { color: var(--muted); }

</style>

</head>


<body>


<div class="login-box">


    <div class="site-logo">
        <img src="assets/miku-logo.png" alt="Personal File Hub logo">
    </div>


    <h1>
        Personal File Hub
    </h1>


    <div class="subtitle">
        Your private cloud
    </div>


    <form id="loginForm">


        <label for="username">
            Username
        </label>


        <input
            id="username"
            type="text"
            placeholder="Enter username"
            autocomplete="username"
            required
        >


        <label for="password">
            Password
        </label>


        <input
            id="password"
            type="password"
            placeholder="Enter password"
            autocomplete="current-password"
            required
        >


        <button
            id="loginButton"
            type="submit"
        >
            Login
        </button>


    </form>


    <div id="message"></div>


</div>


<script>


/*
    IMPORTANT:
    Replace this with your actual
    FastAPI port 8000 URL.
*/

const API_URL =
    "https://personal-file-hub-7spm.onrender.com";


const form =
    document.getElementById(
        "loginForm"
    );


const usernameInput =
    document.getElementById(
        "username"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );


const message =
    document.getElementById(
        "message"
    );


function showMessage(
    text,
    success = false
) {

    message.textContent = text;

    if (success) {

        message.style.color =
            "#5ee39b";

    } else {

        message.style.color =
            "#ff6b6b";

    }

}


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const username =
            usernameInput.value.trim();


        const password =
            passwordInput.value;


        if (!username || !password) {

            showMessage(
                "Enter username and password."
            );

            return;

        }


        loginButton.disabled = true;

        loginButton.textContent =
            "Logging in...";


        showMessage(
            "Connecting..."
        );


        try {


            const response =
                await fetch(
                    API_URL + "/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                username:
                                    username,

                                password:
                                    password
                            })
                    }
                );


            const data =
                await response.json();


            console.log(
                "Login response:",
                data
            );


            if (
                response.ok &&
                data.success &&
                data.token
            ) {


                /*
                    Save JWT
                */

                localStorage.setItem(
                    "token",
                    data.token
                );


                /*
                    Verify that it was
                    actually saved.
                */

                const savedToken =
                    localStorage.getItem(
                        "token"
                    );


                if (!savedToken) {

                    showMessage(
                        "Could not save login session."
                    );

                    return;

                }


                showMessage(
                    "Login successful!",
                    true
                );


                /*
                    Redirect ONLY here,
                    after successful login.
                */

                setTimeout(
                    function() {

                        window.location.href =
                            "dashboard.html";

                    },
                    300
                );


            } else {


                showMessage(
                    data.message ||
                    "Invalid username or password."
                );

            }


        } catch (error) {


            console.error(
                "Login error:",
                error
            );


            showMessage(
                "Could not connect to the server."
            );


        } finally {


            loginButton.disabled = false;

            loginButton.textContent =
                "Login";

        }

    }
);


</script>


</body>

</html>
