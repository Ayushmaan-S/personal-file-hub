<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal File Hub</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f1117;color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font-family:inherit}
button{border:0;cursor:pointer;border-radius:6px;padding:7px 12px;font-size:12px}
button:disabled{opacity:.5;cursor:default}
.app{width:100%;height:100%;display:flex;flex-direction:column}
.topbar{height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#171a21;border-bottom:1px solid #292d36}
.brand{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600}
.brand-icon{font-size:19px}.top-actions{display:flex;gap:7px}
.secondary-button{background:#292e38;color:#dfe3ea}.secondary-button:hover{background:#353b47}
.primary-button{background:white;color:#111318;font-weight:600}.primary-button:hover{background:#ddd}
.danger-button{background:#48262c;color:#ffb7bf}
.workspace{flex:1;min-height:0;display:flex}
.sidebar{width:290px;flex-shrink:0;display:flex;flex-direction:column;background:#14171d;border-right:1px solid #292d36}
.sidebar-header{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 14px;border-bottom:1px solid #292d36}
.sidebar-title{color:#858d9a;font-size:11px;font-weight:700;letter-spacing:1px}
.small-button{width:28px;height:28px;padding:0;background:transparent;color:#929aa8;font-size:17px}.small-button:hover{background:#282d35;color:white}
.search-box{padding:8px;border-bottom:1px solid #242831}.search-box input{width:100%;padding:7px 9px;background:#1c2027;border:1px solid #303641;border-radius:5px;outline:none;color:white;font-size:12px}
.breadcrumbs{display:flex;align-items:center;gap:4px;min-height:38px;padding:5px 10px;border-bottom:1px solid #242831;overflow-x:auto;white-space:nowrap}
.crumb{background:transparent;color:#aeb5c0;padding:5px 6px}.crumb:hover{background:#282d35;color:white}.crumb.current{color:white;font-weight:600}
.file-list{flex:1;overflow-y:auto;padding:5px 0}
.file-item{height:34px;display:flex;align-items:center;gap:8px;padding:0 9px 0 14px;color:#c4c9d2;cursor:pointer;user-select:none;font-family:Consolas,"Courier New",monospace;font-size:12px}
.file-item:hover{background:#20242c}.file-item.active{background:#292e38;color:white}
.file-icon{width:30px;flex-shrink:0;text-align:center;font-family:Arial,sans-serif;font-size:11px}.file-name{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.file-menu{width:22px;height:22px;padding:0;background:transparent;color:#aab1bc;opacity:0;font-size:15px}.file-item:hover .file-menu{opacity:1}.file-menu:hover{background:#3a404b;color:white}
.empty-files{padding:30px 18px;text-align:center;color:#707886;font-size:12px;line-height:1.6}
.editor-area{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:#1e1e1e}
.editor-header{height:44px;flex-shrink:0;display:none;align-items:center;justify-content:space-between;background:#181b21;border-bottom:1px solid #292d36}
.file-tab{height:100%;display:flex;align-items:center;padding:0 15px;color:#d9dde4;font-family:Consolas,"Courier New",monospace;font-size:12px}
.editor-actions{display:flex;gap:6px;padding-right:9px}
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#727a87}
.welcome-icon{font-size:45px;opacity:.5;margin-bottom:15px}.welcome-title{color:#d7dbe2;font-size:22px;margin-bottom:8px}.welcome-text{text-align:center;font-size:12px;line-height:1.8}
#editor{flex:1;min-height:0;width:100%}#viewer{flex:1;min-height:0;width:100%;overflow:auto;display:none;background:#111318}
.image-viewer{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:auto;padding:30px}.image-viewer img{max-width:100%;max-height:100%;object-fit:contain;border-radius:5px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.pdf-viewer{width:100%;height:100%;display:flex;justify-content:center;background:#525659;overflow:auto;padding:20px}.pdf-frame{width:100%;height:100%;border:0;background:white}
.document-viewer{width:100%;min-height:100%;padding:50px;background:#f7f7f7;color:#111;overflow:auto}.document-page{width:min(850px,100%);margin:auto;background:white;min-height:1000px;padding:60px;box-shadow:0 5px 30px rgba(0,0,0,.25)}
.ppt-viewer{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:30px;overflow:auto;background:#20232a}.ppt-message{max-width:500px;text-align:center;color:#aeb5c0;line-height:1.7}
.statusbar{height:23px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 9px;background:#181b21;border-top:1px solid #292d36;color:#858d9a;font-size:10px}
.context-menu{position:fixed;z-index:1000;display:none;width:160px;padding:5px;background:#252a32;border:1px solid #3a404a;border-radius:6px;box-shadow:0 8px 25px rgba(0,0,0,.45)}
.context-menu button{width:100%;display:block;text-align:left;background:transparent;color:#d8dce3;padding:8px 10px;border-radius:4px}.context-menu button:hover{background:#363c47}.context-menu .delete-option{color:#ff9ca6}
.modal-overlay{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.65)}
.modal{width:350px;padding:20px;background:#20242b;border:1px solid #363c46;border-radius:9px}.modal h3{margin:0 0 15px;font-size:16px}.modal input{width:100%;padding:9px;background:#171a20;border:1px solid #383e49;border-radius:5px;color:white;outline:none}.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:16px}
@media(max-width:700px){.sidebar{width:220px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
<div class="brand"><span class="brand-icon">☁</span>Personal File Hub</div>
<div class="top-actions">
<button class="secondary-button" id="newFolderButton">＋ Folder</button>
<button class="secondary-button" id="uploadButton">↑ Upload</button>
<button class="secondary-button" id="logoutButton">Logout</button>
</div>
</header>

<div class="workspace">
<aside class="sidebar">
<div class="sidebar-header">
<span class="sidebar-title">EXPLORER</span>
<button class="small-button" id="refreshButton" title="Refresh">↻</button>
</div>

<div class="search-box">
<input id="searchInput" placeholder="Search current folder...">
</div>

<div class="breadcrumbs" id="breadcrumbs">
<button class="crumb current" data-root="true">☁ Home</button>
</div>

<div class="file-list" id="fileList">
<div class="empty-files">Loading...</div>
</div>
</aside>

<section class="editor-area">
<div class="editor-header" id="editorHeader">
<div class="file-tab" id="fileTab">No file</div>
<div class="editor-actions">
<button class="secondary-button" id="renameButton">Rename</button>
<button class="secondary-button" id="downloadButton">↓ Download</button>
<button class="primary-button" id="saveButton">Save</button>
</div>
</div>

<div class="welcome" id="welcome">
<div class="welcome-icon">◇</div>
<div class="welcome-title">Personal File Hub</div>
<div class="welcome-text">
Select a file to open it.<br>
Double-click a folder to open it.<br>
Code files use the Monaco editor.<br>
Images, PDFs and documents use dedicated viewers.
</div>
</div>

<div id="editor" style="display:none"></div>
<div id="viewer"></div>
</section>
</div>

<footer class="statusbar">
<span id="status">Ready</span>
<span id="language">Plain Text</span>
</footer>
</div>

<input type="file" id="fileInput" style="display:none">

<div class="context-menu" id="contextMenu">
<button id="contextOpen">Open</button>
<button id="contextRename">Rename</button>
<button id="contextDownload">Download</button>
<button id="contextMove">Move to...</button>
<button class="delete-option" id="contextDelete">Delete</button>
</div>

<div class="modal-overlay" id="nameModal">
<div class="modal">
<h3 id="modalTitle">New folder</h3>
<input id="nameInput" autocomplete="off">
<div class="modal-actions">
<button class="secondary-button" id="modalCancel">Cancel</button>
<button class="primary-button" id="modalConfirm">Create</button>
</div>
</div>
</div>

<div class="modal-overlay" id="moveModal">
<div class="modal move-modal">
<h3>Move file to</h3>
<select id="moveFolderSelect" style="width:100%;padding:9px;background:#171a20;border:1px solid #383e49;border-radius:5px;color:white;outline:none"></select>
<div class="modal-actions">
<button class="secondary-button" id="moveCancel">Cancel</button>
<button class="primary-button" id="moveConfirm">Move</button>
</div>
</div>
</div>

<script>
const API_URL="https://personal-file-hub-7spm.onrender.com";
const token=localStorage.getItem("token");
if(!token) window.location.href="index.html";

const $=id=>document.getElementById(id);
const fileList=$("fileList"), editor=$("editor"), viewer=$("viewer");
const welcome=$("welcome"), editorHeader=$("editorHeader"), fileTab=$("fileTab");
const statusElement=$("status"), languageElement=$("language");
const saveButton=$("saveButton"), renameButton=$("renameButton");
const downloadButton=$("downloadButton"), uploadButton=$("uploadButton");
const uploadInput=$("fileInput"), logoutButton=$("logoutButton");
const refreshButton=$("refreshButton"), searchInput=$("searchInput");
const contextMenu=$("contextMenu"), breadcrumbs=$("breadcrumbs");
const newFolderButton=$("newFolderButton"), nameModal=$("nameModal");
const nameInput=$("nameInput"), modalTitle=$("modalTitle");
const modalConfirm=$("modalConfirm"), modalCancel=$("modalCancel");

let monacoEditor=null,currentFile=null,currentFiles=[],currentFolders=[];
let contextItem=null,currentFolderId=null,currentPath=[];
let moveTargetFile=null;
let isDirty=false,currentObjectURL=null,modalMode="create-folder";

function authHeaders(extra={}){return {...extra,Authorization:"Bearer "+token}}
function handleAuth(response){if(response.status===401){logout();return true}return false}

function apiUrl(path){
    return API_URL+path;
}

function getExtension(filename){
    return filename.includes(".")?filename.toLowerCase().split(".").pop():"";
}
function isImageFile(ext){return ["png","jpg","jpeg","gif","webp","svg","bmp","ico"].includes(ext)}
function isCodeFile(filename){
    return ["py","c","h","cpp","cc","cxx","java","js","jsx","ts","tsx","html","htm","css","json","xml","md","sql","sh","bash","txt"].includes(getExtension(filename));
}
function getMonacoLanguage(filename){
    const m={py:"python",c:"c",h:"cpp",cpp:"cpp",cc:"cpp",cxx:"cpp",java:"java",js:"javascript",jsx:"javascript",ts:"typescript",tsx:"typescript",html:"html",htm:"html",css:"css",json:"json",xml:"xml",md:"markdown",sql:"sql",sh:"shell",bash:"shell",txt:"plaintext"};
    return m[getExtension(filename)]||"plaintext";
}
function getViewerType(filename){
    const e=getExtension(filename);
    if(isImageFile(e))return"Image"; if(e==="pdf")return"PDF"; if(e==="docx")return"DOCX"; if(e==="pptx")return"PowerPoint"; if(isCodeFile(filename))return getMonacoLanguage(filename); return"File";
}
function getFileIcon(filename){
    const e=getExtension(filename);
    const icons={py:"🐍",c:"C",h:"C",cpp:"C++",cc:"C++",cxx:"C++",java:"☕",js:"JS",jsx:"JS",ts:"TS",tsx:"TS",html:"◇",css:"#",json:"{}",pdf:"PDF",docx:"W",pptx:"P",png:"IMG",jpg:"IMG",jpeg:"IMG",gif:"IMG",webp:"IMG",svg:"IMG",md:"M",txt:"T"};
    return icons[e]||"•";
}
function escapeHTML(v){return v.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}

require.config({paths:{vs:"https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs"}});
require(["vs/editor/editor.main"],function(){
    monacoEditor=monaco.editor.create(editor,{
        value:"",language:"plaintext",theme:"vs-dark",automaticLayout:true,
        minimap:{enabled:true},fontSize:14,tabSize:4,insertSpaces:true,
        wordWrap:"off",scrollBeyondLastLine:false
    });
    monacoEditor.onDidChangeModelContent(()=>{
        if(currentFile&&isCodeFile(currentFile.filename)){
            isDirty=true;statusElement.textContent="Unsaved changes";updateTab();
        }
    });
    monacoEditor.addCommand(monaco.KeyMod.CtrlCmd|monaco.KeyCode.KeyS,saveCurrentFile);
    loadFolder();
});

async function loadFolder(){
    try{
        fileList.innerHTML='<div class="empty-files">Loading...</div>';
        const q=currentFolderId===null?"":"?parent_id="+encodeURIComponent(currentFolderId);
        const [fr,rr]=await Promise.all([
            fetch(apiUrl("/files"+(currentFolderId===null?"":"?folder_id="+currentFolderId)),{headers:authHeaders()}),
            fetch(apiUrl("/folders"+q),{headers:authHeaders()})
        ]);
        if(handleAuth(fr)||handleAuth(rr))return;
        const fd=await fr.json(), rd=await rr.json();
        if(!fr.ok)throw new Error(fd.detail||"Could not load files");
        if(!rr.ok)throw new Error(rd.detail||"Could not load folders");
        currentFiles=fd.files||[];currentFolders=rd.folders||[];
        renderBreadcrumbs();renderFiles();
        statusElement.textContent=(currentFolders.length+currentFiles.length)+" item(s)";
    }catch(e){
        console.error(e);fileList.innerHTML='<div class="empty-files">Could not load files.</div>';
        statusElement.textContent="Connection error";
    }
}

async function openFolder(folder){
    if(currentFile&&isDirty&&!confirm("You have unsaved changes. Open another folder?"))return;
    currentFolderId=folder.id;
    await loadFolder();
}
async function goHome(){
    if(currentFile&&isDirty&&!confirm("You have unsaved changes. Go home?"))return;
    currentFolderId=null;currentPath=[];closeCurrentFile();await loadFolder();
}

async function updatePath(){
    if(currentFolderId===null){currentPath=[];return}
    const r=await fetch(apiUrl("/folders/"+currentFolderId+"/path"),{headers:authHeaders()});
    if(handleAuth(r))return;
    const d=await r.json();if(r.ok)currentPath=d.path||[];
}
async function renderBreadcrumbs(){
    await updatePath();
    breadcrumbs.innerHTML="";
    const home=document.createElement("button");home.className="crumb"+(currentFolderId===null?" current":"");home.textContent="☁ Home";
    home.onclick=goHome;breadcrumbs.appendChild(home);
    currentPath.forEach((folder,i)=>{
        const sep=document.createElement("span");sep.textContent="›";sep.style.color="#555d68";breadcrumbs.appendChild(sep);
        const b=document.createElement("button");b.className="crumb"+(i===currentPath.length-1?" current":"");b.textContent="📁 "+folder.name;
        b.onclick=async()=>{currentFolderId=folder.id;closeCurrentFile();await loadFolder()};breadcrumbs.appendChild(b);
    });
}

function renderFiles(){
    const search=searchInput.value.trim().toLowerCase();
    fileList.innerHTML="";
    const folders=currentFolders.filter(f=>f.name.toLowerCase().includes(search));
    const files=currentFiles.filter(f=>f.filename.toLowerCase().includes(search));

    if(!folders.length&&!files.length){
        fileList.innerHTML='<div class="empty-files">'+(search?"No matching items.":"This folder is empty.")+"</div>";return;
    }

    folders.forEach(folder=>{
        const item=makeItem(folder,true);
        fileList.appendChild(item);
    });
    files.forEach(file=>{
        const item=makeItem(file,false);
        if(currentFile&&currentFile.id===file.id)item.classList.add("active");
        fileList.appendChild(item);
    });
}
function makeItem(obj,isFolder){
    const item=document.createElement("div");item.className="file-item";
    const icon=document.createElement("div");icon.className="file-icon";icon.textContent=isFolder?"📁":getFileIcon(obj.filename);
    const name=document.createElement("div");name.className="file-name";name.textContent=isFolder?obj.name:obj.filename;
    const menu=document.createElement("button");menu.className="file-menu";menu.textContent="⋮";
    menu.onclick=e=>{e.stopPropagation();showContextMenu(obj,isFolder,e.clientX,e.clientY)};
    item.append(icon,name,menu);
    item.onclick=()=>isFolder?openFolder(obj):openFile(obj);
    item.ondblclick=()=>isFolder?openFolder(obj):openFile(obj);
    item.oncontextmenu=e=>{e.preventDefault();showContextMenu(obj,isFolder,e.clientX,e.clientY)};
    return item;
}

async function openFile(file){
    if(currentFile&&isDirty&&!confirm("You have unsaved changes. Open another file?"))return;
    hideContextMenu();currentFile=file;isDirty=false;editorHeader.style.display="flex";welcome.style.display="none";
    statusElement.textContent="Opening "+file.filename+"...";
    try{
        const e=getExtension(file.filename);
        if(isImageFile(e))await showImage(file);
        else if(e==="pdf")await showPDF(file);
        else if(e==="docx")await showDOCX(file);
        else if(e==="pptx")await showPPTX(file);
        else if(isCodeFile(file.filename))await showCode(file);
        else await showText(file);
        fileTab.textContent=file.filename;updateTab();renderFiles();
    }catch(err){console.error(err);statusElement.textContent="Could not open file";alert(err.message||"Could not open file.")}
}
function prepareViewer(){
    editor.style.display="none";viewer.style.display="block";
    if(monacoEditor){const m=monacoEditor.getModel();if(m)m.dispose()}
    if(currentObjectURL){URL.revokeObjectURL(currentObjectURL);currentObjectURL=null}
    viewer.innerHTML="";
}
async function showCode(file){
    editor.style.display="block";viewer.style.display="none";
    const r=await fetch(apiUrl("/files/"+file.id),{headers:authHeaders()});
    if(handleAuth(r))return;const d=await r.json();
    if(!r.ok)throw new Error(d.detail||"Could not open file");
    monacoEditor.setModel(monaco.editor.createModel(d.content,getMonacoLanguage(file.filename)));
    languageElement.textContent=getMonacoLanguage(file.filename);statusElement.textContent="Ready";monacoEditor.focus();
}
async function showText(file){await showCode(file)}
async function fetchRawBlob(file){
    const r=await fetch(apiUrl("/files/"+file.id+"/raw"),{headers:authHeaders()});
    if(handleAuth(r))throw new Error("Authentication expired.");
    if(!r.ok){let d={};try{d=await r.json()}catch{}throw new Error(d.detail||"Could not load file.");}
    return await r.blob();
}
async function showImage(file){
    prepareViewer();const blob=await fetchRawBlob(file);currentObjectURL=URL.createObjectURL(blob);
    const c=document.createElement("div");c.className="image-viewer";const img=document.createElement("img");img.src=currentObjectURL;img.alt=file.filename;c.appendChild(img);viewer.appendChild(c);
    languageElement.textContent="Image";statusElement.textContent="Ready";
}
async function showPDF(file){
    prepareViewer();const blob=await fetchRawBlob(file);currentObjectURL=URL.createObjectURL(blob);
    const c=document.createElement("div");c.className="pdf-viewer";const iframe=document.createElement("iframe");iframe.className="pdf-frame";iframe.src=currentObjectURL;iframe.title=file.filename;c.appendChild(iframe);viewer.appendChild(c);
    languageElement.textContent="PDF";statusElement.textContent="Ready";
}
async function showDOCX(file){
    prepareViewer();statusElement.textContent="Rendering DOCX...";
    const blob=await fetchRawBlob(file);const ab=await blob.arrayBuffer();
    if(typeof mammoth==="undefined")throw new Error("DOCX viewer failed to load.");
    const result=await mammoth.convertToHtml({arrayBuffer:ab});
    const c=document.createElement("div");c.className="document-viewer";const page=document.createElement("div");page.className="document-page";page.innerHTML=result.value;c.appendChild(page);viewer.appendChild(c);
    languageElement.textContent="DOCX";statusElement.textContent="Ready";
}
async function showPPTX(file){
    prepareViewer();const c=document.createElement("div");c.className="ppt-viewer";
    const m=document.createElement("div");m.className="ppt-message";m.innerHTML="<h2>📊 "+escapeHTML(file.filename)+"</h2><p>PowerPoint preview is not fully supported by the browser viewer.</p><p>Use <strong>Download</strong> to open it in PowerPoint or LibreOffice.</p>";
    c.appendChild(m);viewer.appendChild(c);languageElement.textContent="PowerPoint";statusElement.textContent="Ready";
}

async function saveCurrentFile(){
    if(!currentFile||!isCodeFile(currentFile.filename))return;
    saveButton.disabled=true;statusElement.textContent="Saving...";
    try{
        const r=await fetch(apiUrl("/files/"+currentFile.id),{method:"PUT",headers:authHeaders({"Content-Type":"application/json"}),body:JSON.stringify({content:monacoEditor.getValue()})});
        if(handleAuth(r))return;const d=await r.json();if(!r.ok)throw new Error(d.detail||"Save failed");
        isDirty=false;updateTab();statusElement.textContent="Saved";
    }catch(e){alert(e.message);statusElement.textContent="Save failed"}finally{saveButton.disabled=false}
}
saveButton.onclick=saveCurrentFile;

async function downloadFile(file){
    try{
        statusElement.textContent="Downloading...";
        const r=await fetch(apiUrl("/download/"+file.id),{headers:authHeaders()});
        if(handleAuth(r))return;if(!r.ok)throw new Error("Download failed");
        const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement("a");
        a.href=url;a.download=file.filename;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);statusElement.textContent="Downloaded";
    }catch(e){alert(e.message)}
}
downloadButton.onclick=()=>currentFile&&downloadFile(currentFile);

uploadButton.onclick=()=>uploadInput.click();
uploadInput.onchange=async()=>{
    if(!uploadInput.files.length)return;
    const file=uploadInput.files[0],fd=new FormData();fd.append("file",file);
    if(currentFolderId!==null)fd.append("folder_id",currentFolderId);
    statusElement.textContent="Uploading...";
    try{
        const r=await fetch(apiUrl("/upload"),{method:"POST",headers:authHeaders(),body:fd});
        if(handleAuth(r))return;const d=await r.json();if(!r.ok)throw new Error(d.detail||"Upload failed");
        await loadFolder();statusElement.textContent="Uploaded";
        if(d.file){const uploaded=currentFiles.find(x=>x.id===d.file.id);if(uploaded)await openFile(uploaded)}
    }catch(e){alert(e.message);statusElement.textContent="Upload failed"}
    uploadInput.value="";
};

function openNameModal(mode,obj=null){
    modalMode=mode;contextItem=obj;
    if(mode==="create-folder"){modalTitle.textContent="New folder";modalConfirm.textContent="Create";nameInput.value=""}
    else{modalTitle.textContent=obj.type==="folder"?"Rename folder":"Rename file";modalConfirm.textContent="Rename";nameInput.value=obj.type==="folder"?obj.data.name:obj.data.filename}
    nameModal.style.display="flex";setTimeout(()=>{nameInput.focus();nameInput.select()},50);
}
function closeNameModal(){nameModal.style.display="none";contextItem=null}
newFolderButton.onclick=()=>openNameModal("create-folder");
modalCancel.onclick=closeNameModal;
nameInput.onkeydown=e=>{if(e.key==="Enter")modalConfirm.click();if(e.key==="Escape")closeNameModal()};

modalConfirm.onclick=async()=>{
    const name=nameInput.value.trim();if(!name)return alert("Name cannot be empty");
    try{
        if(modalMode==="create-folder"){
            const r=await fetch(apiUrl("/folders"),{method:"POST",headers:authHeaders({"Content-Type":"application/json"}),body:JSON.stringify({name,parent_id:currentFolderId})});
            if(handleAuth(r))return;const d=await r.json();if(!r.ok)throw new Error(d.detail||"Could not create folder");
            closeNameModal();await loadFolder();statusElement.textContent="Folder created";
        }else if(contextItem.type==="folder"){
            const r=await fetch(apiUrl("/folders/"+contextItem.data.id+"/rename"),{method:"PUT",headers:authHeaders({"Content-Type":"application/json"}),body:JSON.stringify({name})});
            if(handleAuth(r))return;const d=await r.json();if(!r.ok)throw new Error(d.detail||"Rename failed");
            closeNameModal();await loadFolder();statusElement.textContent="Folder renamed";
        }else{
            const r=await fetch(apiUrl("/files/"+contextItem.data.id+"/rename"),{method:"PUT",headers:authHeaders({"Content-Type":"application/json"}),body:JSON.stringify({filename:name})});
            if(handleAuth(r))return;const d=await r.json();if(!r.ok)throw new Error(d.detail||"Rename failed");
            if(currentFile&&currentFile.id===contextItem.data.id){currentFile.filename=d.filename;fileTab.textContent=d.filename}
            closeNameModal();await loadFolder();statusElement.textContent="File renamed";
        }
    }catch(e){alert(e.message)}
};

renameButton.onclick=()=>currentFile&&openNameModal("rename",{type:"file",data:currentFile});

async function openMoveModal(file){
    moveTargetFile=file;
    hideContextMenu();
    const select=$("moveFolderSelect");
    select.innerHTML='<option value="">☁ Home</option>';
    $("moveModal").style.display="flex";
    statusElement.textContent="Loading folders...";
    try{
        const r=await fetch(apiUrl("/folders/all"),{headers:authHeaders()});
        if(handleAuth(r))return;
        const d=await r.json();
        if(!r.ok)throw new Error(d.detail||"Could not load folders");
        const folders=d.folders||[];
        const byParent={};
        folders.forEach(f=>{const key=f.parent_id===null?"root":String(f.parent_id);(byParent[key] ||= []).push(f)});
        function addOptions(parentId,depth){
            const key=parentId===null?"root":String(parentId);
            (byParent[key]||[]).sort((a,b)=>a.name.localeCompare(b.name)).forEach(f=>{
                const option=document.createElement("option");
                option.value=f.id;
                option.textContent="  ".repeat(depth)+"📁 "+f.name;
                select.appendChild(option);
                addOptions(f.id,depth+1);
            });
        }
        addOptions(null,0);
        if(file.folder_id!==null && file.folder_id!==undefined)select.value=String(file.folder_id);
        statusElement.textContent="Choose destination";
    }catch(e){
        $("moveModal").style.display="none";
        moveTargetFile=null;
        alert(e.message);
    }
}

function closeMoveModal(){
    $("moveModal").style.display="none";
    moveTargetFile=null;
}

$("moveCancel").onclick=closeMoveModal;
$("moveConfirm").onclick=async()=>{
    if(!moveTargetFile)return;
    const folderValue=$("moveFolderSelect").value;
    const folderId=folderValue===""?null:Number(folderValue);
    try{
        $("moveConfirm").disabled=true;
        statusElement.textContent="Moving...";
        const r=await fetch(apiUrl("/files/"+moveTargetFile.id+"/move"),{
            method:"PUT",
            headers:authHeaders({"Content-Type":"application/json"}),
            body:JSON.stringify({folder_id:folderId})
        });
        if(handleAuth(r))return;
        const d=await r.json();
        if(!r.ok)throw new Error(d.detail||"Move failed");
        if(currentFile&&currentFile.id===moveTargetFile.id)closeCurrentFile();
        closeMoveModal();
        await loadFolder();
        statusElement.textContent="File moved";
    }catch(e){alert(e.message);statusElement.textContent="Move failed"}
    finally{$("moveConfirm").disabled=false}
};

function showContextMenu(obj,isFolder,x,y){
    contextItem={type:isFolder?"folder":"file",data:obj};
    contextMenu.style.display="block";
    contextMenu.style.left=Math.min(x,window.innerWidth-170)+"px";
    contextMenu.style.top=Math.min(y,window.innerHeight-160)+"px";
    $("contextDownload").style.display=isFolder?"none":"block";
    $("contextMove").style.display=isFolder?"none":"block";
}
function hideContextMenu(){contextMenu.style.display="none"}
document.addEventListener("click",hideContextMenu);

$("contextOpen").onclick=async e=>{
    e.stopPropagation();if(!contextItem)return;
    if(contextItem.type==="folder")await openFolder(contextItem.data);else await openFile(contextItem.data);hideContextMenu();
};
$("contextRename").onclick=e=>{
    e.stopPropagation();if(contextItem)openNameModal("rename",contextItem);hideContextMenu();
};
$("contextMove").onclick=e=>{
    e.stopPropagation();
    if(contextItem&&contextItem.type==="file")openMoveModal(contextItem.data);
};
$("contextDownload").onclick=e=>{
    e.stopPropagation();if(contextItem&&contextItem.type==="file")downloadFile(contextItem.data);hideContextMenu();
};
$("contextDelete").onclick=async e=>{
    e.stopPropagation();if(!contextItem)return;
    const obj=contextItem.data;const isFolder=contextItem.type==="folder";
    if(!confirm(`Delete "${isFolder?obj.name:obj.filename}"?`))return;
    try{
        const url=isFolder?"/folders/"+obj.id:"/files/"+obj.id;
        const r=await fetch(apiUrl(url),{method:"DELETE",headers:authHeaders()});
        if(handleAuth(r))return;const d=await r.json();if(!r.ok)throw new Error(d.detail||"Delete failed");
        if(!isFolder&&currentFile&&currentFile.id===obj.id)closeCurrentFile();
        await loadFolder();statusElement.textContent="Deleted";
    }catch(err){alert(err.message)}
    hideContextMenu();
};

searchInput.oninput=renderFiles;
refreshButton.onclick=loadFolder;
logoutButton.onclick=logout;
function logout(){localStorage.removeItem("token");window.location.href="index.html"}

function closeCurrentFile(){
    if(monacoEditor){const m=monacoEditor.getModel();if(m)m.dispose()}
    if(currentObjectURL){URL.revokeObjectURL(currentObjectURL);currentObjectURL=null}
    currentFile=null;isDirty=false;editor.style.display="none";viewer.style.display="none";editorHeader.style.display="none";welcome.style.display="flex";renderFiles();
}
function updateTab(){
    if(!currentFile)return;
    fileTab.textContent=(isDirty?"● ":"")+currentFile.filename;
    languageElement.textContent=getViewerType(currentFile.filename);
}
window.addEventListener("beforeunload",e=>{if(isDirty){e.preventDefault();e.returnValue=""}});
</script>
</body>
</html>
